const EXP=["gpedit.msc es el archivo de consola del Editor de directivas de grupo local. secpol.msc abre solo la directiva de seguridad local, eventvwr.msc el Visor de eventos y regedit el Registro.", "Home no incluye el Editor de directivas de grupo local. Está en Pro, Enterprise y Education, que tienen más herramientas administrativas.", "gpupdate /force recarga y aplica las directivas al instante. gpresult solo muestra las ya aplicadas, net accounts consulta políticas de cuenta y auditpol las de auditoría.", "El parámetro /h genera un informe HTML detallado de las directivas activas (/r solo da un resumen en consola). Sirve para verificar qué se aplicó realmente.", "La Configuración del equipo afecta a toda la máquina y sus valores se guardan en HKLM (Local Machine).", "La Configuración de usuario afecta solo a quien inició sesión y se guarda en HKCU. Truco: CU = Current User.", "Longitud, complejidad, historial y edad de la contraseña están juntos en Configuración de seguridad > Directivas de cuenta > Directiva de contraseñas.", "Es un ajuste de comportamiento del inicio de sesión, y esos ajustes viven en Directivas locales > Opciones de seguridad (junto a UAC, firma de red y acceso anónimo).", "Los derechos de usuario definen qué acciones puede hacer una cuenta o grupo: iniciar sesión local, apagar el sistema, depurar o actuar como parte del sistema operativo.", "Las plantillas administrativas son interruptores que Windows convierte en cambios del registro. Con ellas se controla Red, Sistema, Defender, Windows Update y AutoRun/AutoPlay.", "Una GPO de dominio se define una vez en Active Directory y llega a muchos equipos. Una política local solo afecta a la máquina donde se configura.", "Con umbral 0 la función de bloqueo queda desactivada: nunca se bloquea, lo que deja la cuenta expuesta a fuerza bruta.", "5 es el equilibrio: un valor muy bajo bloquea por simples errores de tecleo y uno muy alto facilita la fuerza bruta (rango típico: 3 a 10).", "Con duración 0  credenciales y comandos pueden ser interceptados en la red.", "Get-WindowsOptionalFeature con SMB1Protocol consulta si esa característica está habilitada. Los otros comandos revisan firewall, usuarios o GPO.", "Cada servicio activo es una posible puerta de entrada, así que menos servicios innecesarios significa menor superficie de ataque.", "Algunos servicios dependen de otros. Desactivar sin saber para qué sirven puede romper funciones del sistema.", "La superficie de ataque es el conjunto de puntos que un atacante podría aprovechar: servicios, puertos, protocolos y cuentas.", "regedit es el Editor del Registro. gpedit edita directivas, secpol la seguridad local y eventvwr los eventos.", "HKCU guarda la configuración del usuario actual. HKLM guarda la del equipo completo.", "Un cambio incorrecto en el registro puede dañar Windows. Con un punto de restauración o claves exportadas puedes revertirlo.", "Las GPO son centralizadas, repetibles y fáciles de documentar. Editar el registro a mano es más propenso a errores.", "WSUS (Windows Server Update Services) prueba, aprueba y distribuye actualizaciones de forma centralizada. No es antivirus ni firewall.", "WSUS, MECM y Azure Update Manager permiten probar, aprobar y desplegar parches de forma controlada. AppLocker/SRP controlan aplicaciones.", "Cada parche corrige vulnerabilidades conocidas; apagar Windows Update deja el sistema expuesto. Se actualiza de forma controlada, no se desactiva.", "Un parche puede causar incompatibilidades. Probarlo antes evita caídas del servicio en producción.", "Una vulnerabilidad sin parche con exploit público permite ransomware, ejecución remota de código y movimiento lateral por la red.", "Las reglas de entrada bloquean todo salvo lo que una regla permita explícitamente (denegar por defecto).", "Las redes públicas (cafeterías, aeropuertos) no son de confianza. El perfil Público limita las conexiones entrantes y la visibilidad del equipo.", "Es el principio default deny: se cierra todo primero y se abre solo lo necesario, minimizando la exposición.", "Protege archivos y carpetas importantes de modificaciones no autorizadas, que es lo que hace el ransomware al cifrarlos.", "Microsoft Security Compliance Toolkit ofrece baselines de seguridad e incluye Policy Analyzer y LGPO.", "AppLocker crea reglas por editor, ruta o hash para permitir o bloquear ejecutables, scripts e instaladores (lista blanca).", "Get-NetFirewallProfile muestra si cada perfil del firewall (dominio, privado, público) está activo.", "Los eventos de seguridad y auditoría, como los inicios de sesión, se guardan en el registro Seguridad, no en Aplicación.", "auditpol /get /category:* solo consulta qué categorías de auditoría están configuradas; no las modifica.", "Los 3 objetivos son: reducir la superficie de ataque, impedir accesos no autorizados y limitar configuraciones inseguras. No confundir con los 5 pilares.", "El hardening es un proceso continuo: hay que revisar, auditar y verificar. Una baseline aplicada no significa trabajo terminado."];

const BANK=RAW.map((r,k)=>{const p=r.split("|");return{id:k,tc:p[0],t:TOPICS[p[0]],q:p[1],a:p[2],o:p.slice(2),e:EXP[k]}});
const ICON={G:"📜",C:"🔐",S:"⚙️",R:"🗂️",U:"🔄",F:"🛡️",A:"📊",H:"🎯"},EXAM_N=20,EXAM_SEC=1800,LS="hardening_exam_v1";
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const def=()=>({att:[],best:0,wrong:[],streak:0,last:null,tot:0,ok:0});
let st;try{st=Object.assign(def(),JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){st=def()}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const S={screen:"home",mode:null,topic:"all",queue:[],i:0,ans:{},fb:true,left:EXAM_SEC,tm:null,filter:"all",res:null};
const modeName=m=>m=="sim"?"Simulacro":m=="prac"?"Práctica por tema":"Repaso de fallos";
const mmss=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2400)}

function start(mode,topic="all"){
 let pool=BANK;
 if(mode=="prac"&&topic!="all")pool=BANK.filter(x=>x.tc==topic);
 if(mode=="rep")pool=BANK.filter(x=>st.wrong.includes(x.id));
 if(!pool.length)return toast("Aún no tienes preguntas falladas para repasar.");
 if(mode=="sim")pool=shuf(pool).slice(0,EXAM_N);
 Object.assign(S,{screen:"quiz",mode,topic,queue:shuf(pool).map(x=>({...x,o:shuf(x.o)})),i:0,ans:{},fb:mode!="sim",left:EXAM_SEC,filter:"all"});
 if(st.last!=today()){const d=st.last?Math.round((new Date(today())-new Date(st.last))/864e5):0;st.streak=d==1?st.streak+1:1;st.last=today();save()}
 clearInterval(S.tm);
 if(mode=="sim")S.tm=setInterval(()=>{if(--S.left<=0)return finish();const e=$("#tm");if(e){e.textContent=mmss(S.left);e.style.color=S.left<60?"var(--bad)":""}},1000);
 render();
}
function pick(k){
 const q=S.queue[S.i],a=S.ans[q.id];if(S.fb&&a&&a.ch!=null)return;
 const ch=q.o[k];S.ans[q.id]={ch,ok:ch==q.a,fl:a?a.fl:false};view();
}
function view(){const y=scrollY;render();scrollTo(0,y)}
function go(i){if(i<0||i>=S.queue.length)return;S.i=i;render();scrollTo(0,0)}
function finish(){
 clearInterval(S.tm);
 const q=S.queue,ans=q.filter(x=>S.ans[x.id]&&S.ans[x.id].ch!=null);
 if(!ans.length){S.screen="home";render();return toast("No respondiste ninguna pregunta.")}
 const total=S.mode=="sim"?q.length:ans.length,ok=ans.filter(x=>S.ans[x.id].ok).length,tp={};
 q.forEach(x=>{const a=S.ans[x.id];if(S.mode!="sim"&&!(a&&a.ch!=null))return;(tp[x.t]??={c:0,n:0}).n++;if(a&&a.ok)tp[x.t].c++});
 ans.forEach(x=>{const w=st.wrong.indexOf(x.id);if(S.ans[x.id].ok){if(w>-1)st.wrong.splice(w,1)}else if(w<0)st.wrong.push(x.id)});
 st.tot+=ans.length;st.ok+=ok;
 const pct=Math.round(ok/total*100);
 if(S.mode=="sim"&&pct>st.best)st.best=pct;
 const r={date:new Date().toISOString(),mode:S.mode,ok,total,pct,tp};st.att.unshift(r);st.att=st.att.slice(0,15);save();
 S.res=r;S.screen="res";render();scrollTo(0,0);
}
function head(back){return`<header><div class="w"><div class="brand">${back?`<button class="btn" data-a="home" style="padding:6px 11px" aria-label="Inicio">←</button>`:`<div class="logo">🛡️</div>`}<span>Hardening <span style="color:var(--m);font-weight:500">Windows</span></span></div>${st.streak?`<span class="chip">🔥 ${st.streak} ${st.streak>1?"días":"día"}</span>`:""}</div></header>`}

function home(){
 const sc=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
 app.innerHTML=`${head(0)}<main class="w" style="padding-bottom:50px">
<section class="hero fi"><span class="chip">🎓 Examen de práctica · Ciberseguridad</span>
<h1>Domina el <span class="grad">Hardening de Windows</span> antes del examen</h1>
<p>${BANK.length} preguntas de selección múltiple en ${Object.keys(TOPICS).length} temas. Después de cada respuesta te explico por qué es correcta, y la app recuerda tus fallos para que los repases.</p>
<div class="row"><button class="btn pri" data-a="sim">Empezar simulacro ▶</button><button class="btn" data-a="sheet">Practicar por tema</button></div></section>
<section class="card"><div style="padding:16px 16px 4px"><h3>⚡ Lo esencial en 30 segundos</h3><p style="margin:4px 0 0;color:var(--m);font-size:13.5px">Los 3 objetivos del hardening, y los comandos que más caen.</p></div>
<div class="steps"><div class="step"><b>1 · Reducir</b><span>la superficie de ataque: servicios, puertos y apps innecesarias.</span></div><div class="step"><b>2 · Impedir</b><span>accesos no autorizados: contraseñas, mínimo privilegio, UAC.</span></div><div class="step"><b>3 · Limitar</b><span>configuraciones inseguras: políticas, firewall, auditoría.</span></div></div>
<div class="cmds">${["gpedit.msc","gpupdate /force","gpresult /h","net accounts","auditpol /get /category:*","regedit","eventvwr.msc"].map(c=>`<code>${c}</code>`).join("")}</div></section>
<h2>Tu progreso</h2><div class="g4">${sc(st.best?st.best+"%":"—","Mejor simulacro")}${sc(st.streak||0,"Racha (días)")}${sc(st.tot,"Respondidas")}${sc(st.wrong.length,"Por repasar")}</div>
<h2>Modos de estudio</h2>
<button class="card mode" data-a="sim"><span class="chip" style="color:var(--a);border-color:var(--a)">Recomendado</span><h3 style="margin-top:8px">Simulacro de examen</h3><p>${EXAM_N} preguntas al azar, 30 minutos, sin pistas hasta el final. Se aprueba con 70 %.</p></button>
<button class="card mode" data-a="sheet"><h3>Práctica por tema</h3><p>Elige un tema o todos. Verás la explicación apenas respondas, sin cronómetro.</p></button>
<button class="card mode" data-a="rep"><h3>Repaso de fallos <span class="mono" style="color:var(--m);font-size:13px">· ${st.wrong.length}</span></h3><p>Solo las preguntas que has fallado. Salen de la lista cuando las aciertas.</p></button>
<h2>Temas que cubre</h2><div class="tg">${Object.entries(TOPICS).map(([k,v])=>`<button class="tc" data-a="prac" data-t="${k}"><i>${ICON[k]}</i><span>${v}<small>${BANK.filter(x=>x.tc==k).length} preguntas</small></span></button>`).join("")}</div>
${st.att.length?`<h2>Historial reciente</h2><div class="card">${st.att.slice(0,5).map(a=>`<div class="hist"><div><div style="font-size:14px">${modeName(a.mode)}</div><div class="mono" style="font-size:12px;color:var(--m)">${new Date(a.date).toLocaleDateString("es",{day:"2-digit",month:"short"})} · ${a.ok}/${a.total}</div></div><b class="mono" style="color:${a.pct>=70?"var(--ok)":"var(--bad)"}">${a.pct}%</b></div>`).join("")}</div>`:""}
</main>${sheetTopics()}`;
}
function sheetTopics(){return`<div class="sheet" id="sh" data-a="x"><div class="panel" onclick="event.stopPropagation()"><h3>Práctica por tema</h3><p style="color:var(--m);margin:4px 0 14px;font-size:13.5px">¿Qué quieres reforzar ahora?</p>
<button class="tc" style="width:100%;margin-bottom:8px" data-a="prac" data-t="all"><i>🎲</i><span>Todos los temas<small>${BANK.length} preguntas mezcladas</small></span></button>
${Object.entries(TOPICS).map(([k,v])=>`<button class="tc" style="width:100%;margin-bottom:8px" data-a="prac" data-t="${k}"><i>${ICON[k]}</i><span>${v}<small>${BANK.filter(x=>x.tc==k).length} preguntas</small></span></button>`).join("")}</div></div>`}

function quiz(){
 const q=S.queue[S.i],a=S.ans[q.id],n=S.queue.length,done=Object.values(S.ans).filter(x=>x.ch!=null).length,lk=S.fb&&a&&a.ch!=null;
 app.innerHTML=`${head(1)}<main class="w" style="padding-bottom:110px">
<div style="padding:18px 0 6px"><div class="row" style="justify-content:space-between;font-size:12px;color:var(--m);margin-bottom:8px" ><span class="mono">Pregunta ${S.i+1} de ${n}</span><span class="row" style="gap:12px;align-items:center">${S.mode=="sim"?`<b class="mono" id="tm" style="font-size:14px;color:var(--t)">${mmss(S.left)}</b>`:`<span class="mono">${done}/${n} resp.</span>`}<button class="btn" style="padding:4px 10px" data-a="nav">▦</button></span></div>
<div class="bar"><i style="width:${S.i/n*100}%"></i></div></div>
<div class="fi"><div class="row" style="justify-content:space-between;align-items:center;margin:18px 0 12px"><span class="chip">${ICON[q.tc]} ${q.t}</span><button class="btn" style="padding:5px 11px" data-a="flag" aria-label="Marcar">${a&&a.fl?"🔖":"🏷️"}</button></div>
<h2 style="font-size:1.25rem;line-height:1.4;margin:0 0 20px;font-weight:600">${q.q}</h2>
${q.o.map((o,k)=>{let c="opt";if(lk)c+=" lk";if(a&&a.ch!=null){if(S.fb||0){}}
 if(lk){c+=o==q.a?" ok":o==a.ch?" no":" dim"}else if(a&&a.ch==o)c+=" sel";
 return`<button class="${c}" data-a="opt" data-k="${k}" ${lk?"disabled":""}><span class="l">${"ABCD"[k]}</span><span>${o}</span></button>`}).join("")}
${lk?`<div class="ex ${a.ok?"y":"n"}" id="ex"><b>${a.ok?"✔ ¡Correcto!":"✖ Incorrecto · la respuesta correcta es: "+q.a}</b><p>${q.e}</p></div>`:""}</div>
</main><div class="foot"><div class="w"><button class="btn" data-a="prev" ${S.i?"":"disabled"}>Anterior</button><span style="flex:1"></span>${S.i==n-1?`<button class="btn pri" data-a="fin">Finalizar</button>`:`<button class="btn pri" data-a="next">Siguiente</button>`}</div></div>
<div class="sheet" id="nv" data-a="x"><div class="panel" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px"><h3>Preguntas</h3><button class="btn" data-a="fin" style="padding:7px 12px">Finalizar ahora</button></div>
<div class="dots">${S.queue.map((x,i)=>{const z=S.ans[x.id];let c="dot";if(i==S.i)c+=" c";else if(z&&z.ch!=null)c+=S.fb?(z.ok?" g":" r"):" a";if(z&&z.fl)c+=" f";return`<button class="${c}" data-a="jump" data-i="${i}">${i+1}</button>`}).join("")}</div>
<p style="color:var(--m);font-size:12px;margin:14px 0 0">🟡 punto amarillo = marcada para revisar</p></div></div>`;
}

function results(){
 const r=S.res,pass=r.pct>=70,col=pass?"var(--ok)":"var(--bad)";
 const msg=r.pct>=90?"¡Excelente! Estás listo para el examen.":r.pct>=70?"Buen trabajo. Repasa los temas más bajos y lo tienes.":r.pct>=50?"Vas por buen camino. Refuerza los temas en rojo.":"Aún falta repaso, pero cada fallo explicado cuenta. ¡Sigue!";
 const tp=Object.entries(r.tp).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
 app.innerHTML=`${head(1)}<main class="w fi" style="padding:34px 18px 60px">
<div style="text-align:center"><span class="chip">${modeName(r.mode)}</span><div class="ring" style="background:conic-gradient(${col} ${r.pct}%,var(--s2) 0);margin-top:18px"><div style="color:${col}"><span>${r.pct}%<small>${r.ok}/${r.total}</small></span></div></div>
${r.mode=="sim"?`<span class="chip" style="color:${col};border-color:${col}">${pass?"✓ Aprobado":"✕ No aprobado"} · corte 70 %</span>`:""}<p style="color:var(--m)">${msg}</p></div>
<h2>Rendimiento por tema</h2>${tp.map(([t,v])=>{const p=Math.round(v.c/v.n*100);return`<div class="card" style="padding:12px 14px;margin-bottom:8px"><div class="row" style="justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${t}</span><span class="mono" style="color:var(--m)">${v.c}/${v.n}</span></div><div class="bar"><i style="width:${p}%;background:${p>=70?"var(--ok)":p>=50?"var(--am)":"var(--bad)"}"></i></div></div>`}).join("")}
${tp[0]&&tp[0][1].c<tp[0][1].n?`<p style="color:var(--m);font-size:14px">💡 Tema a reforzar: <b style="color:var(--a)">${tp[0][0]}</b></p>`:""}
<div class="row" style="margin:18px 0"><button class="btn pri" data-a="${r.mode=="sim"?"sim":"again"}">Reintentar</button>${st.wrong.length?`<button class="btn" data-a="rep">Repasar fallos (${st.wrong.length})</button>`:""}<button class="btn" data-a="home">Inicio</button></div>
<h2>Revisión detallada</h2><div class="row" style="margin-bottom:12px">${[["all","Todas"],["wrong","Falladas"],["ok","Correctas"],["fl","Marcadas"]].map(([k,l])=>`<button class="btn" style="padding:6px 14px;font-size:13px;${S.filter==k?"border-color:var(--a);color:var(--a)":""}" data-a="flt" data-f="${k}">${l}</button>`).join("")}</div>
${(()=>{const L=S.queue.map((x,i)=>({x,i,a:S.ans[x.id]})).filter(({a})=>S.filter=="all"||(S.filter=="wrong"&&(!a||!a.ok))||(S.filter=="ok"&&a&&a.ok)||(S.filter=="fl"&&a&&a.fl));
 return L.length?L.map(({x,i,a})=>`<details><summary>${a&&a.ok?"✅":"❌"} ${i+1}. ${x.q.length>85?x.q.slice(0,85)+"…":x.q}</summary>${x.o.map(o=>`<div class="rv" style="${o==x.a?"border-color:var(--ok);color:var(--ok)":a&&o==a.ch?"border-color:var(--bad);color:var(--bad)":""}">${o}</div>`).join("")}<p style="font-size:13px;color:#c3cde0;margin:10px 0 0">${x.e}</p></details>`).join(""):`<p style="color:var(--m);text-align:center">No hay preguntas en este filtro.</p>`})()}</main>`;
}
function render(){({home,quiz,res:results})[S.screen]();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="home"){clearInterval(S.tm);S.screen="home";render();scrollTo(0,0)}
 else if(a=="sim")start("sim");else if(a=="rep")start("rep");else if(a=="again")start(S.mode,S.topic);
 else if(a=="prac")start("prac",b.dataset.t);
 else if(a=="sheet")$("#sh").classList.add("open");
 else if(a=="x")document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open"));
 else if(a=="nav")$("#nv").classList.add("open");
 else if(a=="jump")go(+b.dataset.i);
 else if(a=="opt"){pick(+b.dataset.k);const x=$("#ex");if(x)x.scrollIntoView({behavior:"smooth",block:"center"})}
 else if(a=="flag"){const q=S.queue[S.i],z=S.ans[q.id]||(S.ans[q.id]={ch:null,ok:false,fl:false});z.fl=!z.fl;view()}
 else if(a=="prev")go(S.i-1);else if(a=="next")go(S.i+1);else if(a=="fin")finish();
 else if(a=="flt"){S.filter=b.dataset.f;view()}
});
document.addEventListener("keydown",e=>{if(S.screen!="quiz")return;if("1234".includes(e.key)&&e.key)pick(+e.key-1);else if(e.key=="ArrowRight")go(S.i+1);else if(e.key=="ArrowLeft")go(S.i-1)});
render();
</script></body></html>
